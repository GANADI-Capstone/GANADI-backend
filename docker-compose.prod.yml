# 프로덕션 오버라이드 — 로컬 MySQL 제거, RDS 사용
# 사용법: ./scripts/deploy-prod.sh  또는
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:

  mysql:
    profiles:
      - local-only

  backend:
    environment:
      ENVIRONMENT: production
      DATABASE_URL: mysql+pymysql://ganadi_user:${DB_PASSWORD}@${RDS_ENDPOINT}:3306/ganadi_local
      AI_SERVER_URL: http://ai:8000
      CORS_ORIGINS: https://ganadi.site
      FRONTEND_ORIGIN: https://ganadi.site
      PASSWORD_RESET_URL_BASE: https://ganadi.site
      KAKAO_REDIRECT_URI: https://ganadi.site/auth/kakao/callback
      KAKAO_REDIRECT_USE_REFERER: "false"
      EMAIL_DEV_EXPOSE_LINK: "false"
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      ai:
        condition: service_healthy

  frontend:
    build:
      context: ../GANADI-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_KAKAO_MAP_KEY: ${VITE_KAKAO_MAP_KEY}
        VITE_AI_SERVER_URL: https://ganadi.site/ai

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/ganadi:/etc/ssl/ganadi:ro

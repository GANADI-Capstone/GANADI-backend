server {
    listen 80;
    server_name ganadi.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ganadi.site;

    ssl_certificate     /etc/ssl/ganadi/ganadi.pem;
    ssl_certificate_key /etc/ssl/ganadi/ganadi.key;

    client_max_body_size 20M;

    # -----------------------------------------------------------------
    # 보안 헤더 — 카카오맵 SDK / OAuth / 구글 폰트만 화이트리스트
    # 'unsafe-eval' 은 의도적으로 제외 (recharts 는 eval 미사용,
    # XSS 위험이 크므로 dev 빌드 운영 배포를 막아야 함).
    # 'unsafe-inline' (script) 는 SPA/PWA 부트스트랩 인라인 코드 때문에
    # 일단 허용. 추후 nonce/sha256 도입 시 제거 권장.
    # -----------------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; \
script-src 'self' 'unsafe-inline' https://dapi.kakao.com https://t1.daumcdn.net; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; \
font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; \
img-src 'self' data: blob: https://*.daumcdn.net https://*.kakaocdn.net https://t1.daumcdn.net https://k.kakaocdn.net https://*.amazonaws.com; \
connect-src 'self' https://dapi.kakao.com https://kauth.kakao.com https://kapi.kakao.com; \
frame-src https://kauth.kakao.com; \
worker-src 'self' blob:; \
manifest-src 'self'; \
object-src 'none'; \
base-uri 'self'" always;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /api/ {
        proxy_pass         http://backend:8002/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass         http://backend:8002/uploads/;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
    }

    location /ai/ {
        proxy_pass         http://ai:8000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass       http://frontend:80;
        proxy_set_header Host $host;
    }
}

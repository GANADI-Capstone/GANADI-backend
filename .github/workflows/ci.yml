# GANADI-backend (subtree sync 후 레포 루트 기준 경로)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'app/**'
              - 'tests/**'
              - 'alembic/**'
              - 'requirements*.txt'
              - 'pytest.ini'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Alembic single head check
        env:
          DATABASE_URL: sqlite://
          SECRET_KEY: ci-placeholder-secret
        run: |
          heads=$(alembic heads 2>&1 | grep -c '(head)' || true)
          echo "Alembic heads count: $heads"
          if [ "$heads" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head, found $heads"
            alembic heads
            exit 1
          fi

      - name: Pytest
        env:
          DATABASE_URL: sqlite://
          SECRET_KEY: ci-placeholder-secret
          ENVIRONMENT: development
        run: pytest tests/ -q
